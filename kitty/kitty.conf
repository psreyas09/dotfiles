# --- Font & Appearance ---
font_family      JetBrains Mono
font_size        13.0
bold_font        auto
italic_font      auto
bold_italic_font auto
background_opacity 0.90
text_composition_strategy platform
bold_text_in_bright_colors yes

# --- Window Styling & Padding ---
window_padding_width 10 12
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 10000

# --- Cursor Styling ---
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5

# --- Powerline Tab Bar ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
active_tab_font_style   bold
inactive_tab_font_style normal

# --- Shortcuts & Keybindings ---
kitty_mod super

# Window Management
map kitty_mod+enter new_window
map kitty_mod+q      close_window
map kitty_mod+f      toggle_fullscreen

# Tab Management
map kitty_mod+t            new_tab
map kitty_mod+ctrl+q       close_tab
map kitty_mod+ctrl+left    previous_tab
map kitty_mod+ctrl+right   next_tab

# Font Size Shortcuts
map ctrl+equal             change_font_size all +1.0
map ctrl+plus              change_font_size all +1.0
map ctrl+minus             change_font_size all -1.0
map ctrl+0                 change_font_size all 0

# Config Management
map kitty_mod+e      edit_config_file
map kitty_mod+r      load_config_file

# Clipboard (Standard Linux)
copy_on_select yes
map ctrl+shift+c    copy_to_clipboard
map ctrl+shift+v    paste_from_clipboard

# --- Dynamic Theme Link ---
include current-theme.conf
