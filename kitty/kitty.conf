# --- Font & Theme (Tokyo Night) ---
font_family      JetBrainsMono Nerd Font
font_size        13.0
background_opacity 0.86

foreground #c0caf5
background #1a1b26
selection_background #283457

# --- The Missing Shortcuts ---
kitty_mod super

# Window Management
map kitty_mod+enter new_window
map kitty_mod+q      close_window
map kitty_mod+f      toggle_fullscreen

# Tab Management
map kitty_mod+t      new_tab
map kitty_mod+ctrl+q      close_tab
map kitty_mod+ctrl+left   previous_tab
map kitty_mod+ctrl+right  next_tab

# Layout & Config
map kitty_mod+e      edit_config_file
map kitty_mod+r      load_config_file

# Clipboard (Standard Linux)
copy_on_select yes
map ctrl+shift+c    copy_to_clipboard
map ctrl+shift+v    paste_from_clipboard

# --- Window Styling ---
window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0

include current-theme.conf
